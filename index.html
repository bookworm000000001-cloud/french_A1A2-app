    <style>
        /* Custom scrollbar hiding for authentic mobile feel */

            display: none;

            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 3D Card Flip Animation */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Subtle iOS Spring & Shake Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes pop {
            0% { transform: scale(0.92); opacity: 0; }
            70% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(30, 58, 138, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }

        let frenchVoice = null;

        function initVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            // Prefer native French voices (fr-FR)
            frenchVoice = voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Thomas') || v.name.includes('Amelie') || v.name.includes('Google') || v.name.includes('Natural')))
                       || voices.find(v => v.lang.startsWith('fr'))
                       || null;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        function speakFrench(text, rate = 1.0, btnElement = null) {
            if (!('speechSynthesis' in window)) {
                showToast('Text-to-speech is not supported in this browser.', 'fa-volume-xmark');
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = rate;
            if (frenchVoice) utterance.voice = frenchVoice;

            const islandIndicator = document.getElementById('island-indicator');
            
            utterance.onstart = () => {
                if (islandIndicator) islandIndicator.classList.remove('opacity-0');
                if (btnElement) btnElement.classList.add('speaking-pulse');
            };

            utterance.onend = utterance.onerror = () => {
                if (islandIndicator) islandIndicator.classList.add('opacity-0');
                if (btnElement) btnElement.classList.remove('speaking-pulse');
            };

            window.speechSynthesis.speak(utterance);
        }

            msgEl.textContent = message;
            iconEl.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('-translate-y-24', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2600);
        }

            const now = new Date();

            clock.textContent = `${hrs}:${mins}`;

        // -------------------- TAB 3: VOCABULARY BANK --------------------

                    || item.level === state.vocabFilter;

                                <button onclick="setVocabFilter('${tab}')" class="py-1.5 rounded-xl text-[11px] font-bold transition ${active ? 'bg-white text-frenchNavy shadow-sm' : 'text-slate-600 hover:text-slate-900'}">

        function handleVocabSearch(val) {
            state.vocabSearch = val;
            renderViewport();
            // Restore focus & cursor position after re-render
            const input = document.querySelector('#app-viewport input');
            if (input) {
                input.focus();
                input.setSelectionRange(val.length, val.length);
            }
        }

        function setVocabFilter(filter) {
            state.vocabFilter = filter;
            renderViewport();
        }

        function toggleMastered(id) {
            const idx = state.masteredVocab.indexOf(id);
            if (idx > -1) {
                state.masteredVocab.splice(idx, 1);
            } else {
                state.masteredVocab.push(id);
                state.xp += 5;
                showToast('+5 XP! Word marked as mastered.', 'fa-star');
            }
            saveState();
            renderViewport();
        }

                        <p class="text-[11px] text-slate-500 leading-relaxed">

        function resetProgress() {
            state.xp = 0;
            state.streak = 1;
            state.completedLessons = [];
            state.masteredVocab = [];
            saveState();
            showToast('Progress reset to A1 start.', 'fa-rotate-left');
            renderViewport();
        }

        /**
         * ============================================================================
         * 7. INTERACTIVE LESSON PLAYER (FLASHCARDS + 3 QUIZ MODES)
         * ============================================================================
         */
        function startLesson(moduleId) {
            const mod = CURRICULUM.find(m => m.id === moduleId);
            if (!mod) return;

            // Combine 3 flashcards + 3 interactive quizzes into a 6-step learning flow
            const steps = [
                ...mod.flashcards.map(fc => ({ kind: 'flashcard', data: fc })),
                ...mod.quizzes.map(qz => ({ kind: 'quiz', data: qz }))
            ];

            state.currentLesson = mod;
            state.lessonSteps = steps;
            state.currentStepIndex = 0;
            state.cardFlipped = false;
            state.quizAnswered = false;
            state.selectedOption = null;
            state.selectedTiles = [];
            state.sessionXP = 0;

            openLessonOverlay();
            renderLessonStep();
        }

        function startSmartPractice() {
            // Pull 2 random flashcards & 4 random quizzes across unlocked/all modules
            const allFlashcards = CURRICULUM.flatMap(m => m.flashcards);
            const allQuizzes = CURRICULUM.flatMap(m => m.quizzes);

            const pickRandom = (arr, count) => [...arr].sort(() => 0.5 - Math.random()).slice(0, count);

            const steps = [
                ...pickRandom(allFlashcards, 2).map(fc => ({ kind: 'flashcard', data: fc })),
                ...pickRandom(allQuizzes, 4).map(qz => ({ kind: 'quiz', data: qz }))
            ];

            state.currentLesson = {
                id: 'smart-drill',
                level: 'A1–A2',
                title: 'Smart Mixed Drill',
                xpReward: 45
            };
            state.lessonSteps = steps;
            state.currentStepIndex = 0;
            state.cardFlipped = false;
            state.quizAnswered = false;
            state.selectedOption = null;
            state.selectedTiles = [];
            state.sessionXP = 0;

            openLessonOverlay();
            renderLessonStep();
        }

        function openLessonOverlay() {
            const overlay = document.getElementById('lesson-overlay');
            overlay.classList.remove('hidden');
            // Trigger smooth slide-up transition
            requestAnimationFrame(() => {
                overlay.classList.remove('translate-y-full');
            });
        }

        function closeLesson() {
            window.speechSynthesis && window.speechSynthesis.cancel();
            const overlay = document.getElementById('lesson-overlay');
            overlay.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                renderViewport();
            }, 300);
        }

        function renderLessonStep() {
            const stage = document.getElementById('lesson-stage');
            const progressBar = document.getElementById('lesson-progress-bar');
            const counter = document.getElementById('lesson-step-counter');

            const total = state.lessonSteps.length;
            const idx = state.currentStepIndex;

            // Check if lesson is finished
            if (idx >= total) {
                progressBar.style.width = '100%';
                counter.textContent = 'Done';
                renderLessonComplete(stage);
                return;
            }

            const pct = Math.round(((idx + 1) / total) * 100);
            progressBar.style.width = `${pct}%`;
            counter.textContent = `${idx + 1}/${total}`;

            const step = state.lessonSteps[idx];
            if (step.kind === 'flashcard') {
                renderFlashcardStep(stage, step.data);
            } else {
                renderQuizStep(stage, step.data);
            }
        }

        // -------------------- FLASHCARD STEP RENDERER --------------------
        function renderFlashcardStep(stage, card) {
            const escapedFr = card.fr.replace(/'/g, "\\'");

            stage.innerHTML = `

                    <!-- Interactive 3D Flashcard -->

                            <!-- FRONT FACE (FRENCH + AUDIO) -->

                                <div class="space-y-2 my-auto">

                                </div>

                                    <button onclick="speakFrench('${escapedFr}', 1.0, this)" class="px-4 py-2.5 rounded-2xl bg-frenchNavy hover:bg-blue-800 active:scale-95 text-white text-xs font-bold shadow-md flex items-center gap-2 transition">

                                    </button>
                                    <button onclick="speakFrench('${escapedFr}', 0.65, this)" class="px-3.5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition" title="Slow pronunciation">

                                    </button>

                            </div>

                            <!-- BACK FACE (ENGLISH + GRAMMAR NOTE) -->

                                    </div>
                                </div>

                                <span class="text-[11px] font-semibold text-blue-200"><i class="fa-solid fa-rotate mr-1"></i> Tap to see French</span>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Continue Button -->

                    <button onclick="nextLessonStep()" class="w-full py-3.5 rounded-2xl bg-frenchNavy hover:bg-blue-800 active:scale-[0.98] text-white font-bold text-sm shadow-lg shadow-blue-900/20 transition flex items-center justify-center gap-2">
                        Continue <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;

            // Auto-speak French phrase gently on first view
            setTimeout(() => speakFrench(card.fr, 1.0), 250);
        }

        function flipFlashcard() {
            state.cardFlipped = !state.cardFlipped;
            const inner = document.getElementById('flashcard-inner');
            if (inner) {
                inner.classList.toggle('rotate-y-180', state.cardFlipped);

        // -------------------- QUIZ STEP RENDERER (MC / FILL / TILES) --------------------
        function renderQuizStep(stage, quiz) {
            let interactiveHtml = '';

            if (quiz.type === 'mc') {
                interactiveHtml = `
                    ${quiz.audioText ? `
                        <button onclick="speakFrench('${quiz.audioText.replace(/'/g, "\\'")}', 1.0, this)" class="mb-4 inline-flex items-center gap-2 px-3.5 py-2 rounded-2xl bg-blue-50 text-frenchNavy text-xs font-bold active:scale-95 transition">
                            <i class="fa-solid fa-volume-high"></i> Play Audio Hint
                        </button>
                    ` : ''}
                    <div class="space-y-2.5">
                        ${quiz.options.map(opt => {
                            let btnStyle = 'bg-white border-slate-200 text-slate-800 hover:border-frenchNavy';
                            if (state.quizAnswered) {
                                if (opt === quiz.answer) {
                                    btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-800 font-bold';
                                } else if (opt === state.selectedOption) {
                                    btnStyle = 'bg-rose-50 border-frenchCoral text-frenchCoral animate-shake';
                                } else {
                                    btnStyle = 'bg-slate-50 border-slate-100 text-slate-400 opacity-60';
                                }
                            } else if (state.selectedOption === opt) {
                                btnStyle = 'bg-blue-50 border-frenchNavy text-frenchNavy font-bold';
                            }

                            return `
                                <button ${state.quizAnswered ? 'disabled' : ''} onclick="selectQuizOption('${opt.replace(/'/g, "\\'")}')" class="w-full p-3.5 rounded-2xl border-2 text-left text-sm font-semibold transition-all flex items-center justify-between ${btnStyle}">
                                    <span>${opt}</span>
                                    ${state.quizAnswered && opt === quiz.answer ? '<i class="fa-solid fa-circle-check text-emerald-600"></i>' : ''}
                                    ${state.quizAnswered && opt === state.selectedOption && opt !== quiz.answer ? '<i class="fa-solid fa-circle-xmark text-frenchCoral"></i>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (quiz.type === 'fill') {
                const chosenWord = state.selectedOption || '______';
                interactiveHtml = `
                    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 mb-5 text-center">
                        <p class="font-display text-lg font-bold text-slate-900">
                            ${quiz.sentenceBefore}
                            <span class="inline-block px-2.5 py-0.5 mx-1 rounded-lg border-b-2 ${state.selectedOption ? 'bg-blue-100 text-frenchNavy border-frenchNavy' : 'bg-white text-slate-400 border-slate-300'}">${chosenWord}</span>
                            ${quiz.sentenceAfter}
                        </p>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        ${quiz.options.map(opt => {
                            let style = 'bg-white border-slate-200 text-slate-800 hover:border-frenchNavy';
                            if (state.quizAnswered) {
                                if (opt === quiz.answer) style = 'bg-emerald-50 border-emerald-500 text-emerald-800';
                                else if (opt === state.selectedOption) style = 'bg-rose-50 border-frenchCoral text-frenchCoral';
                                else style = 'opacity-50 border-slate-100';
                            } else if (state.selectedOption === opt) {
                                style = 'bg-blue-50 border-frenchNavy text-frenchNavy';
                            }
                            return `
                                <button ${state.quizAnswered ? 'disabled' : ''} onclick="selectQuizOption('${opt.replace(/'/g, "\\'")}')" class="p-3 rounded-2xl border-2 text-sm font-bold transition ${style}">
                                    ${opt}
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (quiz.type === 'tiles') {
                interactiveHtml = `
                    <!-- Selected Sentence Construction Area -->
                    <div class="min-h-[76px] bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-3 mb-5 flex flex-wrap gap-2 items-center">
                        ${state.selectedTiles.length === 0 
                            ? `<span class="text-xs text-slate-400 font-medium mx-auto">Tap words below to build the French sentence</span>`
                            : state.selectedTiles.map((word, i) => `
                                <button ${state.quizAnswered ? 'disabled' : ''} onclick="removeTile(${i})" class="px-3 py-1.5 rounded-xl bg-frenchNavy text-white text-xs font-bold shadow-sm active:scale-95 transition">
                                    ${word}
                                </button>
                            `).join('')
                        }
                    </div>

                    <!-- Available Word Bank Tiles -->
                    <div class="flex flex-wrap gap-2 justify-center">
                        ${quiz.tiles.map((word, i) => {
                            const isUsed = state.selectedTiles.includes(word);
                            return `
                                <button ${state.quizAnswered || isUsed ? 'disabled' : ''} onclick="addTile('${word.replace(/'/g, "\\'")}')" class="px-3.5 py-2 rounded-xl border-2 text-xs font-bold transition ${isUsed ? 'bg-slate-100 border-slate-100 text-slate-300' : 'bg-white border-slate-200 text-slate-800 hover:border-frenchNavy active:scale-95 shadow-sm'}">
                                    ${word}
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            // Feedback Banner when answered
            let isCorrect = false;
            if (state.quizAnswered) {
                if (quiz.type === 'tiles') {
                    isCorrect = state.selectedTiles.join(' ') === quiz.targetSentence;
                } else {
                    isCorrect = state.selectedOption === quiz.answer;
                }
            }

            const canSubmit = quiz.type === 'tiles' ? state.selectedTiles.length > 0 : Boolean(state.selectedOption);

            stage.innerHTML = `
                <div class="flex-1 flex flex-col justify-between animate-pop">
                    <div>
                        <span class="inline-block text-[11px] font-extrabold uppercase tracking-wider text-frenchCoral bg-rose-50 px-3 py-1 rounded-full mb-3">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> ${quiz.type === 'tiles' ? 'Sentence Builder' : quiz.type === 'fill' ? 'Grammar Fill-in' : 'Quick Check'}
                        </span>
                        <h3 class="font-display text-lg font-extrabold text-slate-900 leading-snug mb-4">${quiz.prompt}</h3>
                        ${interactiveHtml}
                    </div>

                    <div class="pt-4 space-y-3">
                        ${state.quizAnswered ? `
                            <div class="p-3.5 rounded-2xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} animate-pop">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-extrabold flex items-center gap-1.5">
                                        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-exclamation text-frenchCoral'}"></i>
                                        ${isCorrect ? 'Très bien ! Correct!' : 'Almost! Correct answer:'}
                                    </span>
                                    <button onclick="speakFrench('${(quiz.targetSentence || quiz.answer).replace(/'/g, "\\'")}', 1.0, this)" class="text-xs font-bold underline">
                                        <i class="fa-solid fa-volume-high"></i> Listen
                                    </button>
                                </div>
                                ${!isCorrect ? `<p class="text-xs font-bold mb-1">${quiz.targetSentence || quiz.answer}</p>` : ''}
                                <p class="text-[11px] leading-relaxed opacity-90">${quiz.explanation}</p>
                            </div>
                            <button onclick="nextLessonStep()" class="w-full py-3.5 rounded-2xl ${isCorrect ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-frenchNavy hover:bg-blue-800'} text-white font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
                                Next Step <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        ` : `
                            <button ${!canSubmit ? 'disabled' : ''} onclick="checkQuizAnswer()" class="w-full py-3.5 rounded-2xl font-bold text-sm transition ${canSubmit ? 'bg-frenchNavy text-white shadow-lg shadow-blue-900/20 active:scale-[0.98]' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                                Check Answer
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function selectQuizOption(opt) {
            if (state.quizAnswered) return;
            state.selectedOption = opt;
            renderLessonStep();
        }

        function addTile(word) {
            if (state.quizAnswered) return;
            state.selectedTiles.push(word);
            renderLessonStep();
        }

        function removeTile(index) {
            if (state.quizAnswered) return;
            state.selectedTiles.splice(index, 1);
            renderLessonStep();
        }

        function checkQuizAnswer() {
            const step = state.lessonSteps[state.currentStepIndex];
            if (!step || step.kind !== 'quiz') return;

            state.quizAnswered = true;
            const quiz = step.data;
            const isCorrect = quiz.type === 'tiles'
                ? state.selectedTiles.join(' ') === quiz.targetSentence
                : state.selectedOption === quiz.answer;

            if (isCorrect) {
                state.sessionXP += 10;
                speakFrench(quiz.targetSentence || quiz.answer, 1.0);
            }
            renderLessonStep();
        }

        function nextLessonStep() {
            state.currentStepIndex++;
            state.cardFlipped = false;
            state.quizAnswered = false;
            state.selectedOption = null;
            state.selectedTiles = [];
            renderLessonStep();
        }

        // -------------------- LESSON COMPLETION CELEBRATION --------------------
        function renderLessonComplete(stage) {
            const mod = state.currentLesson;
            const totalEarned = mod.xpReward + state.sessionXP;

            // Update persistent state
            state.xp += totalEarned;
            if (mod.id !== 'smart-drill' && !state.completedLessons.includes(mod.id)) {
                state.completedLessons.push(mod.id);
            }
            saveState();

            stage.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center px-3 animate-pop">
                    <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-300 text-white flex items-center justify-center text-4xl shadow-xl shadow-amber-500/25 mb-5">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <span class="text-xs font-extrabold uppercase tracking-widest text-frenchCoral mb-1">Félicitations !</span>
                    <h2 class="font-display text-2xl font-extrabold text-slate-900 mb-2">Lesson Complete</h2>
                    <p class="text-xs text-slate-500 max-w-[260px] leading-relaxed mb-6">
                        You completed <strong class="text-slate-800">${mod.title}</strong> (${mod.level}) and strengthened your French skills!
                    </p>

                    <div class="w-full grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-3.5">
                            <div class="text-[10px] font-bold text-frenchNavy uppercase">XP Earned</div>
                            <div class="font-display text-xl font-extrabold text-frenchNavy mt-0.5">+${totalEarned} XP</div>
                        </div>
                        <div class="bg-rose-50 border border-rose-100 rounded-2xl p-3.5">
                            <div class="text-[10px] font-bold text-frenchCoral uppercase">Daily Streak</div>
                            <div class="font-display text-xl font-extrabold text-frenchCoral mt-0.5">${state.streak} Days 🔥</div>
                        </div>
                    </div>
                </div>

                <button onclick="closeLesson()" class="w-full py-3.5 rounded-2xl bg-frenchNavy hover:bg-blue-800 active:scale-[0.98] text-white font-bold text-sm shadow-lg transition">
                    Back to Learning Path
                </button>
            `;
        }

        /**
         * ============================================================================
         * 8. BOOTSTRAP APPLICATION
         * ============================================================================
         */
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            updateClock();
            setInterval(updateClock, 30000);
            renderViewport();
        });
    </script>
</body>
</html>
